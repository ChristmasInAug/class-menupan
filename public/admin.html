<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메뉴판 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Pretendard', sans-serif;
    background: #1a1a1a;
    color: #f0f0f0;
    padding: 40px;
  }
  h1 { font-size: 20px; margin: 0 0 24px; }
  label { display: block; font-size: 13px; color: #b3b3b3; margin: 16px 0 6px; }
  input {
    width: 100%; max-width: 360px; padding: 10px 12px;
    background: #262626; border: 1px solid #3a3a3a; border-radius: 6px;
    color: #f0f0f0; font-size: 14px; font-family: inherit;
  }
  button {
    font-family: inherit; cursor: pointer; border-radius: 6px;
  }
  .option-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .option-btn {
    padding: 8px 14px; font-size: 13px; font-weight: 600;
    border: 1px solid #3a3a3a; background: #262626; color: #d9d9d9;
  }
  .option-btn.active { background: #f0f0f0; color: #1a1a1a; border-color: #f0f0f0; }
  #login-view { max-width: 320px; }
  #settings-view { display: none; max-width: 480px; }
  #save-btn {
    margin-top: 24px; padding: 10px 20px; background: #f0f0f0; color: #1a1a1a;
    border: none; font-size: 14px; font-weight: 700;
  }
  #login-error, #save-status { font-size: 13px; margin-top: 10px; min-height: 18px; }
  #login-error { color: #e0745a; }
  #save-status { color: #7fbf7f; }
</style>
</head>
<body>
  <h1>메뉴판 관리자</h1>

  <div id="login-view">
    <form id="login-form">
      <label for="username">아이디</label>
      <input id="username" name="username" autocomplete="username">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <button id="login-btn" type="submit" style="margin-top:20px;padding:10px 20px;background:#f0f0f0;color:#1a1a1a;border:none;font-weight:700;">로그인</button>
      <div id="login-error"></div>
    </form>
  </div>

  <div id="settings-view">
    <label>매장명</label>
    <input id="store-name">
    <label>영문 태그</label>
    <input id="english-tag">
    <label>자동전환초 (0 = 수동)</label>
    <input id="auto-rotate" type="number" min="0">

    <label>테마</label>
    <div id="theme-options" class="option-row"></div>

    <label>디바이스</label>
    <div id="device-options" class="option-row"></div>

    <button id="save-btn">저장</button>
    <div id="save-status"></div>
  </div>

  <script type="module" src="/admin.js"></script>
</body>
</html>
